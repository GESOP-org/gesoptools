url: https://gesop-org.github.io/gesoptools/es

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "gesoptools — Herramientas internas GESOP"
  description: >
    Package R de uso interno en GESOP para la conexion a la base de datos
    Integra, exportacion de datos de encuesta y procesamiento de ficheros SPSS.

navbar:
  title: "gesoptools"
  left:
    - text: "Inicio"
      href: index.html
    - text: "Funciones"
      href: reference/index.html
    - text: "Articulos"
      menu:
        - text: "Guia de inicio rapido"
          href: articles/quickstart.html
        - text: "Exportar a SPSS y Excel"
          href: articles/export.html
        - text: "Cargar datos en Shiny"
          href: articles/shiny.html
        - text: "Configurar credenciales"
          href: articles/credentials.html
  right:
    - text: "CA"
      href: "https://gesop-org.github.io/gesoptools/ca"
    - icon: fab fa-github
      href: https://github.com/GESOP-org/gesoptools

reference:
  - title: "Conexion y configuracion"
    desc: "Funciones para configurar y verificar la conexion a la BD Integra."
    contents:
      - db_config_from_env
  - title: "Exportacion de datos"
    desc: "Exportar un estudio a fichero SPSS (.sav) o Excel (.xlsx)."
    contents:
      - export_integra
      - export_incidencias_rechazadas
  - title: "Carga de datos"
    desc: "Cargar datos de un estudio directamente en R con el contrato unificado."
    contents:
      - load_integra_study
  - title: "Herramientas para trabajar en R"
    desc: "Carga con multiples separadas y utilidades de analisis sobre los datos cargados."
    contents:
      - load_integra_r
      - split_multiples
      - consultar_incidencias_rechazadas
      - crear_libros_codigos
  - title: "Metricas de campo"
    desc: "Indicadores de trabajo de campo calculados sobre los datos cargados en R."
    contents:
      - calc_loi
  - title: "Utilidades SPSS"
    desc: "Aplicar un diccionario de variables revisado a un fichero SPSS existente."
    contents:
      - apply_variables_dict

footer:
  structure:
    left: developed_by
    right: built_with
